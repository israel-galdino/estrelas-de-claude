<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Órbita Mineradora</title>
<meta name="description" content="Idle de mineração espacial em pixel art">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: viewport de jogo à esquerda, console de comando à direita (empilha no celular) */
:root {
  --void: #06050d;
  --hull: #0f0e22;
  --hull-2: #17153a;
  --hull-3: #221f52;
  --rivet: #2f2b6a;
  --rivet-hi: #4a46a8;
  --text: #dcd8ff;
  --dim: #8c88c0;
  --cyan: #5ef2ff;
  --gold: #ffd23f;
  --mag: #ff6ae0;
  --green: #7dff8a;
  --red: #ff5a6a;
  --orange: #ff9a3a;
  --btn: #2a2670;
  --btn-hi: #6a66d8;
  --btn-lo: #15124a;
  --ok: #1d5e3a;
  --ok-hi: #4ad07a;
  --ok-lo: #0c2e1c;
  --font-pixel: 'Silkscreen', 'Courier New', monospace;
  --font-body: 'VT323', 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--void);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 20px;
  line-height: 1.15;
  overflow: hidden;
  -webkit-font-smoothing: none;
}
#app { display: flex; flex-direction: column; height: 100%; }

/* ---------- HUD ---------- */
#hud {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, var(--hull-2), var(--hull));
  border-bottom: 3px solid var(--rivet);
  box-shadow: 0 3px 0 #000;
  position: relative; z-index: 3;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-pixel); font-size: 20px; margin: 0; letter-spacing: 2px; color: var(--cyan); text-shadow: 2px 2px 0 #0a3a5a; }
.brand small { font-family: var(--font-pixel); font-size: 9px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
.hud-stats { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.stat {
  display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px;
  background: #0a0918; border: 2px solid var(--rivet);
  box-shadow: inset 2px 2px 0 rgba(0,0,0,.5);
  font-variant-numeric: tabular-nums;
}
.stat b { font-size: 24px; font-weight: normal; color: #fff; min-width: 3ch; }
.stat small { font-size: 16px; color: var(--dim); }
#hudCredits b { color: var(--gold); }
#hudData b { color: var(--cyan); }
#hudShards b { color: var(--mag); }
.stat .px, .ico .px { width: 22px; height: 22px; }

/* ---------- Principal ---------- */
main { flex: 1; display: flex; min-height: 0; }
#viewport { flex: 1; position: relative; overflow: hidden; background: #000; cursor: crosshair; min-width: 0; }
#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
#viewport::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
}
body.noscan #viewport::after { display: none; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }

#inventory { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; z-index: 2; }
.inv-row { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px 1px 3px;
  background: rgba(6,5,18,.82); border: 2px solid var(--rivet); font-size: 19px; font-variant-numeric: tabular-nums;
}
.chip .px { width: 22px; height: 22px; }
.chip.ing { border-color: #5a4a20; }
.chip b { font-weight: normal; }
#sectorTag { position: absolute; right: 10px; bottom: 8px; font-family: var(--font-pixel); font-size: 10px; color: var(--dim); background: rgba(6,5,18,.7); padding: 3px 8px; border: 2px solid var(--rivet); z-index: 2; pointer-events: none; }
#eventBanner { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; z-index: 2; }
.ev { font-family: var(--font-pixel); font-size: 11px; padding: 4px 10px; border: 2px solid; background: rgba(6,5,18,.85); animation: pulse 1s steps(2) infinite; white-space: nowrap; }
.ev.gold { color: var(--gold); border-color: var(--gold); }
.ev.orange { color: var(--orange); border-color: var(--orange); }
@keyframes pulse { 50% { filter: brightness(1.5); } }
#log { position: absolute; left: 10px; bottom: 8px; max-width: 60%; font-size: 18px; pointer-events: none; z-index: 2; text-shadow: 2px 2px 0 #000; }

/* ---------- Painel ---------- */
#panel {
  width: 430px; display: flex; flex-direction: column; min-height: 0;
  background: var(--hull); border-left: 3px solid var(--rivet); box-shadow: -3px 0 0 #000;
}
#goal {
  display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: center;
  margin: 8px 8px 0; padding: 6px 10px;
  background: repeating-linear-gradient(135deg, #1a1640 0 6px, #17143a 6px 12px);
  border: 2px solid var(--gold); box-shadow: inset 0 0 0 2px #000;
}
#goal small { grid-column: 1 / -1; font-family: var(--font-pixel); font-size: 9px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
#goal span { font-size: 20px; min-width: 0; }
#goal em { font-style: normal; color: var(--gold); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
#goal em .px { width: 18px; height: 18px; }
#tabs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; padding: 8px 8px 0; }
.tab {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 5px 0 4px; cursor: pointer;
  background: var(--hull-2); color: var(--dim); border: 2px solid var(--rivet); border-bottom: none;
  font-family: var(--font-pixel); font-size: 8px; text-transform: uppercase;
}
.tab .px { width: 22px; height: 22px; opacity: .7; }
.tab:hover { color: var(--text); }
.tab:hover .px { opacity: 1; }
.tab.on { background: var(--hull-3); color: #fff; border-color: var(--rivet-hi); }
.tab.on .px { opacity: 1; }
.tab .dot { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; background: var(--green); display: none; box-shadow: 0 0 0 1px #000; }
.tab.alert .dot { display: block; animation: pulse 0.8s steps(2) infinite; }
.tab:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
#tabContent {
  flex: 1; overflow-y: auto; padding: 10px 10px 16px; margin: 0 8px 8px;
  background: var(--hull-3); border: 2px solid var(--rivet-hi);
  display: flex; flex-direction: column; gap: 8px;
  scrollbar-color: var(--rivet-hi) var(--hull);
}
h3 { font-family: var(--font-pixel); font-size: 11px; margin: 8px 0 0; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; display: flex; gap: 8px; align-items: baseline; }
h3 small { font-family: var(--font-body); font-size: 16px; color: var(--dim); text-transform: none; letter-spacing: 0; }
.hint { margin: 0; font-size: 18px; color: var(--text); }
.dim { color: var(--dim); }
.r { color: var(--red); }
.gold { color: var(--gold); }
.cyan { color: var(--cyan); }
.mag { color: var(--mag); }

/* ---------- Botões ---------- */
.btn {
  font-family: var(--font-pixel); font-size: 10px; color: #fff; text-transform: uppercase; cursor: pointer;
  background: var(--btn); border: 2px solid #000; padding: 6px 10px;
  box-shadow: inset 2px 2px 0 var(--btn-hi), inset -2px -2px 0 var(--btn-lo);
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.btn:hover:not(:disabled) { filter: brightness(1.2); }
.btn:active:not(:disabled) { box-shadow: inset 2px 2px 0 var(--btn-lo), inset -2px -2px 0 var(--btn-hi); transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 8px; font-size: 9px; flex-direction: column; gap: 1px; }
.btn.sm small { font-family: var(--font-body); font-size: 15px; text-transform: none; color: var(--gold); }
.btn.on { background: var(--ok); box-shadow: inset 2px 2px 0 var(--ok-hi), inset -2px -2px 0 var(--ok-lo); }
.btn.wide { width: 100%; padding: 9px; font-size: 11px; }
.btn.magb { background: #6a1a6a; box-shadow: inset 2px 2px 0 var(--mag), inset -2px -2px 0 #2a0a2a; }
.btn.danger { background: #6a1a24; box-shadow: inset 2px 2px 0 var(--red), inset -2px -2px 0 #2a0a10; }
.btn .mini, .mini { width: 16px; height: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.buymode { display: flex; align-items: center; gap: 6px; font-family: var(--font-pixel); font-size: 9px; color: var(--dim); text-transform: uppercase; }
.buymode span { margin-right: auto; }

/* ---------- Cartões ---------- */
.card {
  display: flex; gap: 10px; align-items: center; padding: 8px;
  background: var(--hull-2); border: 2px solid #000;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.06), inset -2px -2px 0 rgba(0,0,0,.35);
}
.card .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card .t { font-family: var(--font-pixel); font-size: 11px; color: #fff; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.card .t.big { font-size: 15px; color: var(--mag); }
.card .lvl { font-family: var(--font-body); font-size: 17px; color: var(--cyan); }
.card .d { font-size: 17px; color: var(--dim); }
.card .e { font-size: 18px; color: var(--text); }
.card .e b { color: var(--green); font-weight: normal; }
.card .arrow { color: var(--dim); }
.icbox { width: 40px; height: 40px; flex: none; display: grid; place-items: center; background: #0a0918; border: 2px solid var(--rivet); }
.icbox .px { width: 33px; height: 33px; }
.icbox.hot { border-color: var(--orange); animation: pulse .5s steps(2) infinite; }
.card.upg .buy { min-width: 92px; flex-direction: column; gap: 2px; }
.card.upg .buy small { font-size: 8px; color: #c8c4ff; }
.card.upg .buy span { display: flex; gap: 3px; align-items: center; font-family: var(--font-body); font-size: 19px; text-transform: none; }
.card.ok { border-color: #1a4a2a; }
.card.ok .buy { background: var(--ok); box-shadow: inset 2px 2px 0 var(--ok-hi), inset -2px -2px 0 var(--ok-lo); }
.card.maxed { opacity: .7; }
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.stats4 > div { background: #0a0918; border: 2px solid var(--rivet); padding: 4px 6px; display: flex; flex-direction: column; min-width: 0; }
.stats4 small { font-family: var(--font-pixel); font-size: 7px; color: var(--dim); text-transform: uppercase; }
.stats4 b { font-weight: normal; font-size: 21px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* refino */
select {
  font-family: var(--font-body); font-size: 18px; color: var(--text); background: #0a0918;
  border: 2px solid var(--rivet-hi); padding: 2px 4px; width: 100%;
}
.bar { height: 8px; background: #0a0918; border: 2px solid #000; margin-top: 3px; }
.bar i { display: block; height: 100%; transition: width .25s linear; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.chip.big { font-size: 17px; padding: 3px 8px 3px 4px; }
.chip.big span { flex: 1; color: var(--dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* mercado */
.card.auto { flex-direction: column; align-items: stretch; gap: 6px; }
.tog { display: flex; gap: 8px; align-items: center; font-size: 19px; cursor: pointer; }
.tog input { width: 18px; height: 18px; accent-color: var(--green); }
.rng { display: flex; flex-direction: column; gap: 2px; font-size: 18px; }
.rng input { width: 100%; accent-color: var(--gold); }
.mrow { display: flex; align-items: center; gap: 8px; padding: 5px 6px; background: var(--hull-2); border: 2px solid #000; }
.mrow .oi { width: 30px; height: 30px; flex: none; }
.mrow .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 19px; }
.mrow .nm small { font-size: 16px; color: var(--dim); }
.mrow .pr { display: flex; flex-direction: column; align-items: flex-end; min-width: 58px; font-variant-numeric: tabular-nums; }
.mrow .pr b { font-weight: normal; color: var(--gold); font-size: 19px; }
.mrow .pr small { font-size: 15px; }
.mrow .spacer { width: 64px; }
.mrow .btn { min-width: 76px; }
.up { color: var(--green); }
.down { color: var(--red); }
.spark { flex: none; }
.spark polyline { fill: none; stroke-width: 1.5; }
.spark polyline.up, .spark circle.up { stroke: var(--green); fill: none; }
.spark polyline.down, .spark circle.down { stroke: var(--red); fill: none; }
.spark circle.up { fill: var(--green); }
.spark circle.down { fill: var(--red); }
.spark .base { stroke: var(--rivet-hi); stroke-dasharray: 2 2; stroke-width: 1; }

/* pesquisa */
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.card.res { flex-direction: column; align-items: stretch; gap: 4px; }
.card.res .btn { margin-top: auto; font-family: var(--font-body); font-size: 19px; }
.card.res.done { border-color: #1a4a2a; background: #12241e; }
.card.res.done .tag { color: var(--green); }
.card.res.locked { opacity: .55; }
.card.res.ok { border-color: var(--cyan); }
.tag { font-family: var(--font-pixel); font-size: 9px; text-transform: uppercase; margin-top: auto; }
.tag.here { color: var(--green); padding: 4px 8px; border: 2px solid var(--green); }

/* setores */
.card.sec { align-items: flex-start; }
.card.sec .planet { width: 64px; height: 64px; flex: none; background: #05040c; border: 2px solid var(--rivet); }
.card.sec .planet.unk { filter: brightness(0) drop-shadow(0 0 0 #333); opacity: .6; }
.card.sec.cur { border-color: var(--green); }
.card.sec.locked { opacity: .6; }
.card.sec .btn, .card.sec .tag { align-self: center; }
.ores { display: flex; gap: 2px; align-items: center; }
.ores .px { width: 22px; height: 22px; }
.ores small { margin-left: 6px; color: var(--orange); font-size: 16px; }
.req { font-size: 17px; }
.req b { font-weight: normal; }
.g { color: var(--green); }

/* salto */
.card.prest { flex-direction: column; align-items: stretch; gap: 8px; border-color: #4a1a4a; background: linear-gradient(180deg, #24123a, #17153a); }

/* troféus */
.agrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.ach { display: flex; gap: 6px; align-items: center; padding: 5px; background: var(--hull-2); border: 2px solid #000; opacity: .5; }
.ach.got { opacity: 1; border-color: #5a4a10; }
.ach .px { width: 28px; height: 28px; flex: none; }
.ach div { display: flex; flex-direction: column; min-width: 0; }
.ach b { font-family: var(--font-pixel); font-size: 9px; font-weight: normal; color: var(--gold); }
.ach small { font-size: 15px; color: var(--dim); }

/* ajustes */
.card.cfg { flex-wrap: wrap; }
.card.cfg .btn { flex: 1 1 45%; }
.statlist { display: grid; gap: 2px; }
.statlist div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 6px; background: var(--hull-2); font-size: 18px; }
.statlist b { font-weight: normal; color: var(--cyan); font-variant-numeric: tabular-nums; }

/* ---------- Toasts e modal ---------- */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; z-index: 20; pointer-events: none; width: min(420px, calc(100% - 32px)); }
.toast {
  display: flex; gap: 10px; align-items: center; padding: 8px 12px;
  background: #0d0b24; border: 2px solid var(--rivet-hi); box-shadow: 4px 4px 0 #000;
  animation: tin .25s steps(4);
}
.toast.gold { border-color: var(--gold); }
.toast.cyan { border-color: var(--cyan); }
.toast .px { width: 30px; height: 30px; flex: none; }
.toast div { display: flex; flex-direction: column; min-width: 0; }
.toast b { font-family: var(--font-pixel); font-size: 10px; font-weight: normal; color: var(--gold); text-transform: uppercase; }
.toast.cyan b { color: var(--cyan); }
.toast small { font-size: 18px; }
.toast.out { opacity: 0; transform: translateY(8px); transition: all .5s steps(5); }
@keyframes tin { from { transform: translateY(16px); opacity: 0; } }
#modal { position: fixed; inset: 0; background: rgba(2,1,8,.75); display: grid; place-items: center; z-index: 30; padding: 16px; }
.modal-box { width: min(480px, 100%); background: var(--hull-2); border: 3px solid var(--rivet-hi); box-shadow: 6px 6px 0 #000, inset 2px 2px 0 rgba(255,255,255,.06); padding: 16px; max-height: 90vh; overflow-y: auto; }
.modal-box h2 { font-family: var(--font-pixel); font-size: 15px; margin: 0 0 8px; color: var(--cyan); }
.modal-box p { margin: 0 0 10px; }
.modal-box .row { margin-top: 12px; }
textarea { width: 100%; height: 110px; background: #0a0918; color: var(--text); border: 2px solid var(--rivet-hi); font-family: monospace; font-size: 12px; resize: vertical; word-break: break-all; }

/* ---------- Responsivo ---------- */
@media (max-width: 900px) {
  main { flex-direction: column; }
  #viewport { flex: none; height: 48vh; height: 48dvh; }
  #panel { width: auto; flex: 1; border-left: none; border-top: 3px solid var(--rivet); }
  .brand small { display: none; }
  #log { display: none; }
  .tab span { display: none; }
}
@media (max-width: 480px) {
  body { font-size: 18px; }
  .hud-stats { margin-left: 0; width: 100%; }
  .stat b { font-size: 20px; }
  .stats4 { grid-template-columns: repeat(2, 1fr); }
  .rgrid, .agrid, .grid2 { grid-template-columns: 1fr; }
  .mrow .spark, .mrow .spacer { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .ev, .tab.alert .dot, .icbox.hot { animation: none; }
  .toast { animation: none; }
}

</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand"><h1>ÓRBITA</h1><small>mineradora estelar</small></div>
    <div class="hud-stats">
      <div class="stat" id="hudCredits" title="Créditos"><span class="ico" data-ico="coin"></span><b id="credits">0</b><small id="cps">+0/s</small></div>
      <div class="stat" id="hudData" title="Dados de pesquisa"><span class="ico" data-ico="data"></span><b id="data">0</b><small>dados</small></div>
      <div class="stat" id="hudShards" title="Fragmentos Estelares" hidden><span class="ico" data-ico="shard"></span><b id="shards">0</b><small>frag.</small></div>
    </div>
  </header>
  <main>
    <section id="viewport" aria-label="Campo de asteroides">
      <canvas id="game"></canvas>
      <div id="inventory"></div>
      <div id="eventBanner"></div>
      <div id="log" aria-live="polite"></div>
      <div id="sectorTag"><span id="sectorName"></span></div>
    </section>
    <aside id="panel">
      <div id="goal"></div>
      <nav id="tabs"></nav>
      <div id="tabContent"></div>
    </aside>
  </main>
</div>
<div id="toasts"></div>
<div id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"><div id="modalBody"></div></div></div>

<script>
'use strict';
/* ===== Utilidades: RNG, ruído, cores, formatação e fonte bitmap 3x5 ===== */
const U = (() => {
  const U = {};
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  U.randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  U.pick = arr => arr[Math.floor(Math.random() * arr.length)];
  U.wpick = (items, w) => {
    let s = 0;
    for (const x of w) s += x;
    let r = Math.random() * s;
    for (let i = 0; i < items.length; i++) { r -= w[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  };
  U.smooth = (a, b, x) => { const t = U.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  U.mulberry = seed => {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  // Value noise 3D (suave, determinístico por seed)
  U.noise3 = seed => {
    const r = U.mulberry(seed * 9973 + 17);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
    const P = new Uint8Array(512);
    for (let i = 0; i < 512; i++) P[i] = p[i & 255];
    const V = new Float32Array(256);
    for (let i = 0; i < 256; i++) V[i] = r();
    return (x, y, z) => {
      const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
      const xf = x - xi, yf = y - yi, zf = z - zi;
      const X = xi & 255, Y = yi & 255, Z = zi & 255;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
      const A = P[X] + Y, B = P[X + 1] + Y;
      const AA = P[A] + Z, AB = P[A + 1] + Z, BA = P[B] + Z, BB = P[B + 1] + Z;
      const x1 = V[P[AA]] + (V[P[BA]] - V[P[AA]]) * u;
      const x2 = V[P[AB]] + (V[P[BB]] - V[P[AB]]) * u;
      const x3 = V[P[AA + 1]] + (V[P[BA + 1]] - V[P[AA + 1]]) * u;
      const x4 = V[P[AB + 1]] + (V[P[BB + 1]] - V[P[AB + 1]]) * u;
      const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
      return y1 + (y2 - y1) * w;
    };
  };
  U.fbm = (n, x, y, z, oct = 4) => {
    let a = 0.5, f = 1, s = 0, t = 0;
    for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f, z * f); t += a; a *= 0.5; f *= 2.03; }
    return s / t;
  };

  // Dithering ordenado (Bayer 4x4) — devolve -0.5..0.5
  const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16 - 0.5);
  U.bayer = (x, y) => BAY[((y & 3) << 2) + (x & 3)];

  U.hex = h => {
    h = h.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  };
  U.rgb = (c, a) => (a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`);
  U.mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  U.canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; };

  // Sprite a partir de strings; outline opcional gera contorno escuro de 1px
  U.sprite = (rows, pal, outline) => {
    const h = rows.length, w = rows[0].length, o = outline ? 1 : 0;
    const c = U.canvas(w + o * 2, h + o * 2), g = c.getContext('2d');
    const solid = (x, y) => y >= 0 && y < h && x >= 0 && x < w && rows[y][x] !== '.' && rows[y][x] !== ' ';
    if (outline) {
      g.fillStyle = typeof outline === 'string' ? outline : '#06060e';
      for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
        if (solid(x, y)) continue;
        if (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1)) g.fillRect(x + o, y + o, 1, 1);
      }
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.' || ch === ' ') continue;
      g.fillStyle = pal[ch] || '#f0f';
      g.fillRect(x + o, y + o, 1, 1);
    }
    return c;
  };
  U.flipX = src => {
    const c = U.canvas(src.width, src.height), g = c.getContext('2d');
    g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
    return c;
  };

  const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'UDc', 'DDc', 'TDc', 'QaDc', 'QiDc'];
  U.fmt = n => {
    if (n === Infinity) return '∞';
    if (!isFinite(n)) return '0';
    if (n < 0) return '-' + U.fmt(-n);
    if (n < 10) return (Math.floor(n * 10) / 10).toFixed(n % 1 > 0.05 ? 1 : 0);
    if (n < 1000) return Math.floor(n).toString();
    const e = Math.floor(Math.log10(n) / 3);
    if (e >= SUF.length) return n.toExponential(2).replace('+', '');
    const v = n / Math.pow(1000, e);
    return (v < 10 ? Math.floor(v * 100) / 100 : v < 100 ? Math.floor(v * 10) / 10 : Math.floor(v)) + SUF[e];
  };
  U.fmtTime = s => {
    s = Math.max(0, Math.floor(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${x}s`;
    return `${x}s`;
  };

  /* ---- Fonte bitmap 3x5 para textos dentro do canvas ---- */
  const GL = {
    '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111',
    '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001010010010',
    '8': '111101111101111', '9': '111101111001111',
    A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
    E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
    I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
    M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
    Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
    U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
    Y: '101101010010010', Z: '111001010100111',
    '+': '000010111010000', '-': '000000111000000', '.': '000000000000010', ',': '000000000010100',
    '!': '010010010000010', '%': '101001010100101', ':': '000010000010000', '/': '001001010100100',
    '?': '111001010000010', ' ': '000000000000000', '×': '000101010101000', '(': '010100100100010',
    ')': '010001001001010', '>': '100010001010100', '<': '001010100010001', '#': '101111101111101',
    '*': '000101010101000', "'": '010010000000000', '=': '000111000111000'
  };
  U.norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  U.textW = (s, sc = 1) => U.norm(s).length * 4 * sc - sc;
  U.text = (ctx, str, x, y, col, sc = 1, align = 'left', shadow = 'rgba(4,3,12,0.9)') => {
    const s = U.norm(str);
    const w = s.length * 4 * sc - sc;
    if (align === 'center') x -= Math.floor(w / 2); else if (align === 'right') x -= w;
    x = Math.round(x); y = Math.round(y);
    const draw = (ox, oy, c) => {
      ctx.fillStyle = c;
      for (let k = 0; k < s.length; k++) {
        const g = GL[s[k]] || GL['?'];
        for (let j = 0; j < 15; j++) if (g.charCodeAt(j) === 49) ctx.fillRect(x + ox + k * 4 * sc + (j % 3) * sc, y + oy + Math.floor(j / 3) * sc, sc, sc);
      }
    };
    if (shadow) { draw(sc, 0, shadow); draw(0, sc, shadow); draw(sc, sc, shadow); }
    draw(0, 0, col);
    return w;
  };

  U.store = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { window.localStorage.removeItem(k); } catch (e) { /* sem storage */ } }
  };
  return U;
})();

/* ===== Efeitos sonoros sintetizados (WebAudio) ===== */
const SFX = (() => {
  let ctx = null, master = null, noiseBuf = null;
  const last = {};
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.22;
      master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ctx = null; }
  }
  function tone(f0, f1, dur, type = 'square', vol = 0.2, delay = 0) {
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol = 0.2, freq = 1200, delay = 0) {
    const t = ctx.currentTime + delay;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf;
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  const defs = {
    hit: () => { tone(260 + Math.random() * 90, 110, 0.06, 'square', 0.08); noise(0.05, 0.08, 2200); },
    crit: () => { tone(700, 160, 0.14, 'square', 0.12); noise(0.12, 0.16, 3200); },
    boom: () => { noise(0.4, 0.28, 420); tone(130, 38, 0.32, 'triangle', 0.22); },
    coin: () => { tone(988, 988, 0.05, 'square', 0.07); tone(1319, 1319, 0.09, 'square', 0.07, 0.05); },
    buy: () => { tone(440, 660, 0.07, 'square', 0.08); tone(660, 990, 0.09, 'square', 0.07, 0.06); },
    comet: () => { [0, 0.07, 0.14, 0.21].forEach((d, k) => tone(660 + k * 220, 880 + k * 220, 0.12, 'triangle', 0.1, d)); },
    warp: () => { tone(70, 1400, 1.1, 'sawtooth', 0.07); noise(1.3, 0.12, 700); },
    unlock: () => { [523, 659, 784, 1046].forEach((f, k) => tone(f, f, 0.16, 'square', 0.08, k * 0.09)); },
    ach: () => { [784, 988, 1175].forEach((f, k) => tone(f, f, 0.12, 'triangle', 0.1, k * 0.07)); },
    zap: () => tone(1100, 320, 0.07, 'sawtooth', 0.04),
    ui: () => tone(520, 620, 0.03, 'square', 0.04),
    deny: () => tone(180, 120, 0.1, 'square', 0.06),
    prestige: () => { tone(60, 2000, 2.0, 'sawtooth', 0.08); noise(2.0, 0.15, 500); [262, 330, 392, 523, 659].forEach((f, k) => tone(f, f, 0.5, 'triangle', 0.08, 1 + k * 0.12)); }
  };
  function play(name, gap = 0.04) {
    if (typeof S === 'undefined' || !S || !S.settings.sound) return;
    init();
    if (!ctx || ctx.state !== 'running') return;
    const now = ctx.currentTime;
    if (last[name] && now - last[name] < gap) return;
    last[name] = now;
    try { defs[name] && defs[name](); } catch (e) { /* áudio indisponível */ }
  }
  return { play, init };
})();

/* ===== Gráficos procedurais em pixel art: asteroides, planetas, nebulosas, estação, drones, ícones ===== */
const GFX = (() => {
  const X = {};
  const norm3 = v => { const m = Math.hypot(v[0], v[1], v[2]); return [v[0] / m, v[1] / m, v[2] / m]; };

  /* ---------- Asteroide: rocha irregular, crateras, veios de minério, rotação no plano ---------- */

    const R = o.r, S = Math.ceil(R * 2.5) + 4, N = o.frames || 24, half = S / 2;
    const rnd = U.mulberry(o.seed);
    const nA = U.noise3(o.seed), nB = U.noise3(o.seed + 7777);

    for (let k = 2; k <= 6; k++) harm.push([k, (rnd() * 0.12 + 0.02) / (k * 0.6), rnd() * 6.2832]);
    const shape = th => { let v = 0.9; for (const h of harm) v += h[1] * Math.sin(h[0] * th + h[2]); return v; };
    const craters = [];
    const nc = 1 + Math.floor(rnd() * 3 + R / 6);
    for (let i = 0; i < nc; i++) {
      const z = 0.3 + rnd() * 0.7, a = rnd() * 6.2832, s = Math.sqrt(1 - z * z);
      const cr = 0.16 + rnd() * 0.26;

      const Re = R * shape(Math.atan2(oy, ox));
      if (Math.hypot(ox, oy) > Re) continue;

      const hy = U.fbm(nA, u * f + 9, (v + e) * f + 9, w * f + 9, 3);

        this.ringBack = U.canvas(RS, RS); this.ringFront = U.canvas(RS, RS);
        const gb = this.ringBack.getContext('2d'), gf = this.ringFront.getContext('2d');
        const rn = U.noise3(seed + 5);
        const rc = rg.col.map(U.hex);
        for (let y = 0; y < RS; y++) for (let x = 0; x < RS; x++) {
          const dx = x + 0.5 - RS / 2, dy = y + 0.5 - RS / 2;
          const rx = dx * ca + dy * sa, ry = -dx * sa + dy * ca;
          const e = Math.sqrt(rx * rx + (ry / flat) * (ry / flat));
          if (e < ri || e > ro) continue;
          const t = (e - ri) / (ro - ri);
          const band = rn(t * 22, 0.5, 0.5) * 0.75 + rn(t * 60, 3.5, 0.5) * 0.25;
          if (band < 0.36) continue;
          // sombra do planeta sobre o anel (lado oposto à luz)
          const shadow = ry > 0 && rx > 0 && Math.abs(rx) < r * 1.05 && (dx * 0.75 + dy * 0.45) > 0 ? 0.45 : 1;
          const k = U.clamp(Math.floor((band - 0.36) * 4.5 + U.bayer(x, y) * 0.8), 0, 2);
          const col = rc[k].map(c => c * shadow);
          const g = ry < 0 ? gb : gf;
          g.fillStyle = U.rgb(col, 0.55 + k * 0.2);
          g.fillRect(x, y, 1, 1);
        }
      }
    }
    render(t) {
      const d = this.img.data, def = this.def, pal = this.pal, ep = this.emiPal, atm = this.atm;
      const TW = this.TW, tex = this.tex, emi = this.emi, isStar = def.type === 'star';
      const off = t * (def.spin || 0.05);
      const k2pi = TW / 6.2832;
      for (let k = 0; k < this.cnt; k++) {
        let tx = Math.floor((this.lon[k] + off) * k2pi) % TW;
        if (tx < 0) tx += TW;
        const ti = this.ty[k] * TW + tx;
        const v = tex[ti], e = emi[ti], dif = this.dif[k], b = this.bay[k], rim = this.rim[k];
        let col;
        if (isStar) {
          const li = U.clamp(Math.floor((0.55 + v * 0.7 - rim * 0.5) * 5 + b), 0, 4);
          col = pal[li];
        } else {
          const lum = dif * (0.5 + v * 0.65) + v * 0.06;
          col = pal[U.clamp(Math.floor(lum * 6 + b), 0, 5)];
          if (e > 0.12) {
            const ei = U.clamp(Math.floor(e * 3 + b * 0.8), 0, 2);
            if (ei > 0 || dif < 0.3) col = ep[ei];
          }
          if (rim > 0.72) {
            const a = ((rim - 0.72) / 0.28) * (0.25 + dif * 0.75);
            if (a + b * 0.5 > 0.3) col = U.mix(col, atm, Math.min(0.85, a));
          }
        }
        const q = this.idx[k];
        d[q] = col[0]; d[q + 1] = col[1]; d[q + 2] = col[2]; d[q + 3] = 255;
      }
      this.g.putImageData(this.img, 0, 0);
    }
    drawTo(c, x, y) {
      x = Math.round(x); y = Math.round(y);
      if (this.ringBack) c.drawImage(this.ringBack, x - (this.ringBack.width >> 1), y - (this.ringBack.height >> 1));
      c.drawImage(this.halo, x - (this.halo.width >> 1), y - (this.halo.height >> 1));
      c.drawImage(this.cv, x - (this.P >> 1), y - (this.P >> 1));
      if (this.ringFront) c.drawImage(this.ringFront, x - (this.ringFront.width >> 1), y - (this.ringFront.height >> 1));
    }
  };

  /* ---------- Nebulosa de fundo com dithering + estrelas fixas ---------- */
  X.makeNebula = (W, H, neb, seed) => {
    const c = U.canvas(W, H), g = c.getContext('2d'), img = g.createImageData(W, H), d = img.data;
    const n = U.noise3(seed), m = U.noise3(seed + 3);
    const C = neb.c.map(U.hex), A = neb.alt.map(U.hex);
    const sc = 3 / Math.max(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const X0 = x * sc, Y0 = y * sc;
      const q = U.fbm(n, X0, Y0, 0.5, 3);
      const v = U.fbm(n, X0 * 1.4 + q * 2.4, Y0 * 1.4 + q * 2.4, 2.5, 5);
      const dens = U.smooth(0.4, 0.72, v);
      const hue = U.fbm(m, X0 * 0.9, Y0 * 0.9, 1.1, 3);
      const b = U.bayer(x, y);
      const k = U.clamp(Math.floor(dens * 3.99 + b * 0.9), 0, 3);
      let col = C[k];
      if (k > 0 && hue + b * 0.05 > 0.53) col = A[k - 1];
      const i = (y * W + x) * 4;
      d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
    }
    const r = U.mulberry(seed + 9), sc2 = U.hex(neb.star);
    const count = Math.floor((W * H) / 120);
    for (let s = 0; s < count; s++) {
      const x = Math.floor(r() * W), y = Math.floor(r() * H), br = r();
      const i = (y * W + x) * 4, f = br < 0.75 ? 0.25 + br * 0.45 : 0.9;
      const col = br > 0.93 ? sc2 : [235, 240, 255];
      d[i] = Math.max(d[i], col[0] * f); d[i + 1] = Math.max(d[i + 1], col[1] * f); d[i + 2] = Math.max(d[i + 2], col[2] * f);
    }
    g.putImageData(img, 0, 0);
    for (let s = 0; s < count / 45; s++) {
      const x = Math.floor(r() * W), y = Math.floor(r() * H);
      g.fillStyle = neb.star;
      g.globalAlpha = 0.5; g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3);
      g.globalAlpha = 0.2; g.fillRect(x - 3, y, 7, 1); g.fillRect(x, y - 3, 1, 7);
      g.globalAlpha = 1; g.fillStyle = '#ffffff'; g.fillRect(x, y, 1, 1);
    }
    return c;
  };

  X.makeVignette = (W, H) => {
    const c = U.canvas(W, H), g = c.getContext('2d');
    g.fillStyle = '#020108';
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const dx = (x / W - 0.5) * 2, dy = (y / H - 0.5) * 2;
      const d = Math.sqrt(dx * dx * 0.7 + dy * dy * 0.9);
      const a = (d - 0.78) * 2.2;
      if (a > U.bayer(x, y) + 0.5) g.fillRect(x, y, 1, 1);
    }
    return c;
  };

  /* ---------- Brilho pixelado (aditivo) ---------- */
  const glowCache = {};
  X.glow = (col, r) => {
    const key = col + r;
    if (glowCache[key]) return glowCache[key];
    const S = r * 2 + 1, c = U.canvas(S, S), g = c.getContext('2d'), rgb = U.hex(col);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const d = Math.hypot(x - r, y - r) / (r + 0.5);
      if (d >= 1) continue;
      const lv = Math.floor((1 - d) * 4) / 4;
      if (lv <= 0) continue;
      g.fillStyle = U.rgb(rgb, Math.pow(lv, 1.6) * 0.85);
      g.fillRect(x, y, 1, 1);
    }
    glowCache[key] = c;
    return c;
  };

  /* ---------- Estação orbital ---------- */
  const HULL = ['#121524', '#262c48', '#434d74', '#6f7ba6', '#a9b3d8', '#e6eaff'];

  X.sphere = (g, cx, cy, r, pal) => {
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
      const d2 = (x * x + y * y) / (r * r);
      if (d2 > 1) continue;
      const z = Math.sqrt(1 - d2);
      const dif = Math.max(0, (x / r) * LIGHT[0] + (y / r) * LIGHT[1] + z * LIGHT[2]);
      const k = U.clamp(Math.floor((0.1 + dif * 0.95) * pal.length + U.bayer(x + cx, y + cy) * 0.9), 0, pal.length - 1);
      g.fillStyle = pal[k];
      g.fillRect(cx + x, cy + y, 1, 1);
    }
  };
  X.stationBase = (lvl, turret) => {
    const key = lvl + '|' + (turret ? 1 : 0);
    if (stCache[key]) return stCache[key];
    const W = 76, H = 64, cx = X.ST_CX, cy = X.ST_CY;
    const c = U.canvas(W, H), g = c.getContext('2d');
    const P = (col, x, y, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    const panel = (x, y, w, h) => {
      P('#070b22', x - 1, y - 1, w + 2, h + 2);

        const grid = i % 4 === 3 || j % 3 === 2;
        let col = grid ? '#16245e' : j % 3 === 0 ? '#3a7ae0' : '#2459b0';
        if (!grid && (i + j * 2) % 11 === 0) col = '#8ac4ff';
        P(col, x + i, y + j);
      }
    };
    const truss = (x, y, w) => { P(HULL[1], x, y, w, 2); for (let i = 0; i < w; i += 3) P(HULL[3], x + i, y); };
    const vtruss = (x, y, h) => { P(HULL[1], x, y, 2, h); for (let i = 0; i < h; i += 3) P(HULL[3], x, y + i); };

    // módulos extras (progressão visual da estação)
    if (lvl >= 1) { vtruss(cx + 10, cy - 20, 10); truss(cx + 4, cy - 20, 10); panel(cx + 14, cy - 27, 16, 8); }
    if (lvl >= 3) { vtruss(cx - 14, cy + 13, 8); panel(cx - 34, cy + 17, 20, 7); truss(cx - 14, cy + 20, 6); }
    if (lvl >= 4) {
      truss(cx - 22, cy - 22, 18);
      for (let x = 0; x < 14; x++) {
        const cols = [HULL[4], HULL[3], HULL[3], HULL[2], HULL[1], HULL[0]];
        for (let y = 0; y < 6; y++) P(cols[y], cx - 30 + x, cy - 25 + y);
        if (x % 3 === 1) P('#ffe9a0', cx - 30 + x, cy - 23);
      }
      P(HULL[0], cx - 31, cy - 25, 1, 6); P(HULL[0], cx - 16, cy - 25, 1, 6);
    }
    // painéis solares principais
    truss(6, cy - 1, 20);
    panel(3, cy - 14, 20, 10);
    panel(3, cy + 4, 20, 10);
    // espinha central
    const scol = [HULL[1], HULL[4], HULL[3], HULL[3], HULL[2], HULL[2], HULL[1], HULL[0]];
    for (let y = 6; y < 55; y++) for (let i = 0; i < 8; i++) P(y % 6 === 0 && i > 0 && i < 7 ? HULL[1] : scol[i], cx - 4 + i, y);
    // antena
    P(HULL[3], cx, 0, 1, 6); P(HULL[2], cx - 3, 3, 7, 1); P(HULL[4], cx - 2, 2, 1, 1); P(HULL[4], cx + 2, 2, 1, 1);
    // braço de doca
    for (let y = 0; y < 7; y++) P([HULL[4], HULL[3], HULL[3], HULL[2], HULL[2], HULL[1], HULL[0]][y], cx + 8, cy - 3 + y, 11, 1);
    for (let x = cx + 9; x < cx + 19; x += 3) P(HULL[1], x, cy - 3, 1, 7);
    // baia de atracação
    P(HULL[0], cx + 18, cy - 9, 13, 19);
    for (let y = 0; y < 17; y++) P(y < 2 ? HULL[4] : y < 5 ? HULL[3] : y < 12 ? HULL[2] : HULL[1], cx + 19, cy - 8 + y, 11, 1);
    P('#04050b', cx + 24, cy - 5, 6, 11);
    P('#0a0d1c', cx + 24, cy - 5, 6, 2);
    for (let i = 0; i < 11; i++) P(i % 2 ? '#ffcc33' : '#1a1a1a', cx + 23, cy - 5 + i);
    // segundo hangar
    if (lvl >= 2) {
      P(HULL[0], cx + 4, cy + 14, 14, 9);
      for (let y = 0; y < 7; y++) P([HULL[4], HULL[3], HULL[2], HULL[2], HULL[1], HULL[1], HULL[0]][y], cx + 5, cy + 15 + y, 12, 1);
      P('#04050b', cx + 12, cy + 17, 5, 4);
      // antena parabólica
      for (let i = 0; i < 9; i++) P(i < 4 ? HULL[4] : HULL[2], cx + 20 + i, cy + 21 - Math.round(Math.abs(i - 4) * 0.6));
      P(HULL[3], cx + 24, cy + 15, 1, 6); P(HULL[5], cx + 24, cy + 14);
    }
    // núcleo esférico
    X.sphere(g, cx, cy, 10, HULL);
    for (let x = -10; x <= 10; x++) {
      const yy = Math.round(Math.sqrt(Math.max(0, 1 - (x * x) / 100)) * 1.2);
      const colA = x < -4 ? '#ffb060' : x < 3 ? '#d0601c' : '#7a2e10';
      if (Math.abs(x) <= 9) { P(colA, cx + x, cy - 1 + yy - 1); P(x < 0 ? '#7a2e10' : '#4a1a08', cx + x, cy + yy); }
    }
    for (let x = -7; x <= 7; x += 3) P('#ffe9a0', cx + x, cy - 4);
    // reator
    P(HULL[2], cx - 6, 54, 12, 2); P(HULL[1], cx - 5, 56, 10, 2); P('#0b3a44', cx - 3, 58, 6, 2);
    if (turret) { P(HULL[1], cx - 3, cy - 12, 7, 2); P(HULL[3], cx - 2, cy - 13, 5, 1); }
    stCache[key] = c;
    return c;
  };
  const ringDraw = (ctx, x, y, t, back) => {
    const a = 23, b = 6;
    for (let i = 0; i < 170; i++) {
      const th = (i / 170) * 6.2832, s = Math.sin(th), co = Math.cos(th);

      const px = Math.round(x + co * a), py = Math.round(y + s * b);

function syncDrones() {
  const n = D.drones();
  while (G.drones.length < n) G.drones.push(newDrone());
  while (G.drones.length > n) { const d = G.drones.pop(); releaseTarget(d); }
}
function releaseTarget(d) { if (d.target) { d.target.targ = Math.max(0, d.target.targ - 1); d.target = null; } }
function setTarget(d, a) { releaseTarget(d); d.target = a; a.targ++; }
function pickTarget(d) {
  let best = null, bs = 1e9;
  for (const a of G.ast) {
    if (!a.alive || a.entering) continue;
    if (d.cargo.amt > 0 && a.ore !== d.cargo.ore) continue;
    const sc = Math.hypot(a.x - d.x, a.y - d.y) + a.targ * 32 - (a.rich ? 70 : 0) + Math.random() * 25;
    if (sc < bs) { bs = sc; best = a; }
  }
  return best;
}
function moveTo(d, tx, ty, spd, dt) {
  const dx = tx - d.x, dy = ty - d.y, dist = Math.hypot(dx, dy);
  const s = spd * Math.min(1, dist / 16 + 0.12);
  const dvx = dist > 0.01 ? (dx / dist) * s : 0, dvy = dist > 0.01 ? (dy / dist) * s : 0;
  const k = Math.min(1, dt * 5);
  d.vx += (dvx - d.vx) * k; d.vy += (dvy - d.vy) * k;
  d.x += d.vx * dt; d.y += d.vy * dt;
  if (Math.abs(d.vx) > 4) d.face = d.vx > 0 ? 1 : -1;
  return dist;
}
function minePoint(d, a) {
  const ang = Math.atan2(G.st.y - a.y, G.st.x - a.x) + d.spread, r = a.R + 7;
  return [a.x + Math.cos(ang) * r, a.y + Math.sin(ang) * r];
}
function updateDrone(d, dt) {
  const spd = D.speed();
  if (d.state === 'dock') {
    d.x = G.dock.x; d.y = G.dock.y; d.vx = 0; d.vy = 0;
    d.t -= dt;
    if (d.t > 0 || G.warp) return;
    const a = pickTarget(d);
    if (a) { setTarget(d, a); d.state = 'out'; d.vx = spd * 0.5; d.face = 1; } else d.t = 0.4;
    return;
  }
  if (d.state === 'out' || d.state === 'mine') {
    const a = d.target;
    if (!a || !a.alive) {
      releaseTarget(d);
      if (d.cargo.amt < D.cargo() * 0.7) {
        const n = pickTarget(d);
        if (n) { setTarget(d, n); d.state = 'out'; return; }
      }
      d.state = 'back';
      return;
    }
    const mp = minePoint(d, a);
    const dist = moveTo(d, mp[0], mp[1], spd, dt);
    if (d.state === 'out') { if (dist < 3) d.state = 'mine'; return; }
    d.face = a.x > d.x ? 1 : -1;
    if (dist > 9) { d.state = 'out'; return; }
    const cap = D.cargo(), room = cap - d.cargo.amt;
    const dmg = Math.min(D.dps() * dt, room * (a.maxHp / a.units));
    const u = damageAsteroid(a, dmg, false);
    d.cargo.ore = a.ore;
    d.cargo.amt += u;
    if (Math.random() < dt * 22) {
      const ang = Math.atan2(d.y - a.y, d.x - a.x);
      const ix = a.x + Math.cos(ang) * a.R * 0.8, iy = a.y + Math.sin(ang) * a.R * 0.8;
      part(ix, iy, Math.cos(ang + U.rand(-1, 1)) * U.rand(10, 35), Math.sin(ang + U.rand(-1, 1)) * U.rand(10, 35), U.rand(0.2, 0.5), U.pick([ORES[a.ore].col[3], ORES[a.ore].col[4], '#ffffff']), { add: true });
    }
    if (d.cargo.amt >= cap * 0.999) { releaseTarget(d); d.state = 'back'; }
    return;
  }
  if (d.state === 'back') {
    const dist = moveTo(d, G.dock.x, G.dock.y, spd, dt);
    if (dist < 3) {
      if (d.cargo.amt > 0) {
        addOre(d.cargo.ore, d.cargo.amt, true);
        G.dockGlow = 0.6;
        sparks(G.dock.x, G.dock.y, [ORES[d.cargo.ore].col[4], '#ffffff'], 3, 18, true);
      }
      d.cargo.amt = 0; d.cargo.ore = -1;
      d.state = 'dock'; d.t = 0.35;
    }
  }
}

/* ---------- Cliques, cometas, torreta ---------- */
function clickAt(x, y, auto) {
  if (G.warp) return;
  for (const c of G.comets) if (Math.hypot(c.x - x, c.y - y) < 12) { catchComet(c); return; }
  const a = astAt(x, y);
  if (!a) return;
  let dmg = D.click();
  const crit = Math.random() < D.crit();
  if (crit) { dmg *= 5; S.stats.crits++; G.shake = Math.max(G.shake, 2.5); }
  S.stats.clicks++;
  const u = damageAsteroid(a, dmg, true);
  addOre(a.ore, u, false);
  const oc = ORES[a.ore].col;
  sparks(x, y, [oc[3], oc[4], '#ffffff'], crit ? 16 : 6, crit ? 70 : 45, true);
  for (let i = 0; i < Math.min(3, 1 + Math.floor(u / 4)); i++) pickup(x, y, oc[3]);
  floatText(x, y - 8, '+' + U.fmt(u), oc[4], crit);
  if (crit) floatText(x, y - 20, 'CRITICO!', '#ff6a6a', false);
  if (!auto || crit) SFX.play(crit ? 'crit' : 'hit');
}
function spawnComet() {
  const fromLeft = Math.random() < 0.5;
  G.comets.push({ x: fromLeft ? -10 : G.W + 10, y: U.rand(G.H * 0.12, G.H * 0.5), vx: (fromLeft ? 1 : -1) * U.rand(34, 50), vy: U.rand(3, 12), t: 0 });
  log('Um cometa dourado cruza o setor! Clique nele.', '#ffd23f');
  SFX.play('comet');
}
function catchComet(c) {
  c.dead = true;
  S.stats.comets++;
  const gm = S.pupg.golden ? 2 : 1;
  const r = Math.random();
  let msg;
  if (r < 0.45) {
    const v = Math.max(60, G.cps * 90, (D.click() / D.hpu(S.sector)) * 60 * priceOf(SECTORS[S.sector].ores[0])) * gm;
    earn(v); msg = `+${U.fmt(v)} CR`;
    log(`Cometa capturado: +${U.fmt(v)} créditos`, '#ffd23f');
  } else if (r < 0.8) {
    G.buffs.frenzy = Math.max(G.buffs.frenzy, 30 * gm);
    msg = 'FRENESI!';
    log(`Frenesi: drones e cliques ×3 por ${30 * gm}s`, '#ffd23f');
  } else {
    const v = Math.max(10, S.dataRate * 150, (1 + S.sector) * 12) * gm;
    S.data += v; msg = `+${U.fmt(v)} DADOS`;
    log(`Cometa capturado: +${U.fmt(v)} dados`, '#5ef2ff');
  }
  floatText(c.x, c.y - 10, msg, '#ffd23f', true);
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * 6.2832, s = U.rand(10, 80);
    part(c.x, c.y, Math.cos(a) * s, Math.sin(a) * s, U.rand(0.4, 1.2), U.pick(['#fff3b0', '#ffd23f', '#ffffff', '#ff9a3a']), { add: true, sz: Math.random() < 0.3 ? 2 : 1 });
  }
  G.rings.push({ x: c.x, y: c.y, r: 2, max: 26, t: 0, col: '#ffd23f' });
  G.shake = Math.max(G.shake, 2);
  SFX.play('ach');
}
function updateTurret(dt) {
  if (!S.research.turret) return;
  G.timers.turret -= dt;
  G.muzzle = Math.max(0, G.muzzle - dt);
  if (G.timers.turret > 0) return;
  const cands = G.ast.filter(a => a.alive && !a.entering);
  if (!cands.length) { G.timers.turret = 0.3; return; }
  G.timers.turret = D.turretInt();
  const a = U.pick(cands);
  const sx = G.st.x, sy = G.st.y - 13;
  G.tang = Math.atan2(a.y - sy, a.x - sx);
  G.muzzle = 0.08;
  G.bolts.push({ x: sx + Math.cos(G.tang) * 6, y: sy + Math.sin(G.tang) * 6, a, vx: 0, vy: 0 });
  SFX.play('zap', 0.1);
}

/* ---------- Eventos e mercado ---------- */
function updateEvents(dt) {
  const T = G.timers;
  T.comet -= dt;
  if (T.comet <= 0) { spawnComet(); T.comet = U.rand(90, 200) / (S.research.comet ? 2 : 1); }
  T.shower -= dt;
  if (T.shower <= 0 && !G.event) {
    G.event = { type: 'shower', t: 25, name: 'Chuva de Meteoros' };
    G.banner = { title: 'CHUVA DE METEOROS', sub: 'ASTEROIDES EXTRAS E MAIS RICOS', t: 0, life: 3, col: '#ff9a3a' };
    log('Chuva de meteoros! Asteroides extras por 25s.', '#ff9a3a');
    T.shower = U.rand(300, 480);
  }
  T.boom -= dt;
  if (T.boom <= 0) {
    const seen = ORES.map((o, i) => i).filter(i => S.seen[i]);
    const i = U.pick(seen);
    S.prices[i] = U.rand(2.2, 3);
    log(`Alta no mercado: ${ORES[i].name} a ${Math.round(S.prices[i] * 100)}%!`, '#7dff8a');
    T.boom = U.rand(120, 240);
  }
  if (G.event) { G.event.t -= dt; if (G.event.t <= 0) G.event = null; }
  if (G.buffs.frenzy > 0) G.buffs.frenzy -= dt;
}
function marketTick() {
  for (let i = 0; i < ORES.length; i++) {
    let m = S.prices[i];
    m += (1 - m) * 0.035 + (Math.random() - 0.5) * 0.12;
    S.prices[i] = U.clamp(m, 0.35, 3.2);
    G.hist[i].push(S.prices[i]);
    if (G.hist[i].length > HIST_LEN) G.hist[i].shift();
  }
}
// Uma passada da venda automática (limiar de preço, reserva das fornalhas e opção de lingotes).
// Usada tanto em tempo real quanto nos ganhos offline.
function autoSellPass() {
  let v = 0;
  for (let i = 0; i < ORES.length; i++) {
    if (S.prices[i] < S.autosell.thr) continue;
    v += sellOre(i, true, reserveOf(i));
    if (S.autosell.ingots) v += sellIngot(i, true);
  }
  return v;
}
function autoSell() {
  if (!S.research.autosell || !S.autosell.on) return;
  const v = autoSellPass();
  if (v > 0) { floatText(G.dock.x, G.dock.y - 14, '+' + U.fmt(v), '#ffd23f'); SFX.play('coin', 0.5); }
}
function refineTick(dt) {
  const n = D.furnaces(), T = D.refineTime(), B = D.batch();
  while (S.furnaces.length < n) S.furnaces.push({ ore: -1, prog: 0, busy: false, take: 0 });
  let any = false;
  for (let k = 0; k < n; k++) {
    const f = S.furnaces[k];
    if (f.ore < 0) continue;
    if (!f.busy) {
      const take = Math.min(B, Math.floor(S.ores[f.ore] / 10) * 10);
      if (take < 10) continue;
      S.ores[f.ore] -= take; f.take = take; f.busy = true; f.prog = 0;
    }
    any = true;
    f.prog += dt / T;
    if (f.prog >= 1) {
      const out = f.take / 10;
      f.prog = 0; f.busy = false;
      S.ingots[f.ore] += out; S.stats.ingots += out;
    }
  }
  G.refineFx = any;
}
function setFurnace(k, ore) {
  const f = S.furnaces[k];
  if (!f) return;
  if (f.busy && f.ore >= 0 && f.ore !== ore) { S.ores[f.ore] += f.take; f.busy = false; f.prog = 0; f.take = 0; }
  f.ore = ore;
}

/* ---------- Conquistas e missões ---------- */
function checkProgress() {
  for (const a of ACH) {
    if (!S.ach[a.id] && a.c(S)) {
      S.ach[a.id] = 1;
      UI.toast('Conquista desbloqueada', `${a.n} · +3% no valor dos minérios`, 'trophy', 'gold');
      SFX.play('ach');
    }
  }
  const g = GOALS[S.goal];
  if (g && g.c(S)) {
    earn(g.r);
    S.goal++;
    UI.toast('Missão concluída', `${g.t} · +${U.fmt(g.r)} créditos`, 'star', 'cyan');
    SFX.play('unlock');
  }
}

/* ---------- Atualização principal ---------- */
function update(dt) {
  G.t += dt;
  S.stats.play += dt;
  if (G.warp) updateWarp(dt);
  updateEvents(dt);

  // asteroides: surgimento
  const shower = G.event && G.event.type === 'shower';
  const maxA = D.maxAst() + (shower ? 6 : 0);
  G.spawnT -= dt;
  if (!G.warp && G.ast.length < maxA && G.spawnT <= 0) {
    G.ast.push(makeAst(shower && Math.random() < 0.8 ? { shower: true, sz: Math.random() < 0.7 ? 's' : 'm' } : {}));
    G.spawnT = shower ? 0.45 : G.ast.length < 3 ? 0.3 : U.rand(0.8, 2);
  }
  // asteroides: movimento
  const r = G.reg;
  for (const a of G.ast) {
    a.fa += dt * a.fs;
    if (a.flash > 0) a.flash -= dt;
    if (a.hitT > 0) a.hitT -= dt;
    a.x += a.vx * dt; a.y += a.vy * dt;
    if (a.entering) {
      if (a.shower && Math.random() < dt * 30) part(a.x + U.rand(-2, 2), a.y - a.R * 0.6, U.rand(-4, 4), -U.rand(10, 25), U.rand(0.2, 0.5), U.pick(['#ffb040', '#ff6a20', '#fff3b0']), { add: true, sz: 2 });
      if (inRegion(a) && a.x <= a.tx + 2 && (!a.shower || a.y >= a.ty)) { a.entering = false; a.vx = U.rand(-3, 3); a.vy = U.rand(-3, 3); }
      if (a.x < -40 || a.y > G.H + 40) a.alive = false;
      continue;
    }
    if (a.x < r.x0 + a.R) a.vx = Math.abs(a.vx) + 0.5;
    if (a.x > r.x1 - a.R) a.vx = -Math.abs(a.vx) - 0.5;
    if (a.y < r.y0 + a.R) a.vy = Math.abs(a.vy) + 0.5;
    if (a.y > r.y1 - a.R) a.vy = -Math.abs(a.vy) - 0.5;
    a.vx = U.clamp(a.vx, -6, 6); a.vy = U.clamp(a.vy, -6, 6);
    if ((a.rich || ORES[a.ore].glow) && Math.random() < dt * (a.rich ? 4 : 2)) {
      const an = Math.random() * 6.2832, rr = Math.random() * a.R;
      part(a.x + Math.cos(an) * rr, a.y + Math.sin(an) * rr, 0, -4, 0.5, a.rich ? '#fff3b0' : ORES[a.ore].col[4], { add: true, drag: 0 });
    }
  }
  for (let i = 0; i < G.ast.length; i++) {
    const a = G.ast[i];
    if (a.entering) continue;
    for (let j = i + 1; j < G.ast.length; j++) {
      const b = G.ast[j];
      if (b.entering) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = a.R + b.R + 4;
      if (d < min) {
        const p = ((min - d) / d) * Math.min(1, dt * 2);
        a.x -= dx * p * 0.5; a.y -= dy * p * 0.5; b.x += dx * p * 0.5; b.y += dy * p * 0.5;
      }
    }
  }
  G.ast = G.ast.filter(a => a.alive);

  // drones
  syncDrones();
  for (const d of G.drones) updateDrone(d, dt);
  G.dockGlow = Math.max(0, G.dockGlow - dt * 2);

  // torreta e projéteis
  updateTurret(dt);
  for (const b of G.bolts) {
    const a = b.a;
    if (!a.alive) { b.dead = true; continue; }
    const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
    if (d < a.R) {
      b.dead = true;
      const u = damageAsteroid(a, D.click() * 0.6, false);
      addOre(a.ore, u, true);
      sparks(b.x, b.y, ['#5ef2ff', '#ffffff', ORES[a.ore].col[4]], 5, 40, true);
      continue;
    }
    b.vx = (dx / d) * 260; b.vy = (dy / d) * 260;
    b.x += b.vx * dt; b.y += b.vy * dt;
  }
  G.bolts = G.bolts.filter(b => !b.dead);

  // cometas
  for (const c of G.comets) {
    c.t += dt; c.x += c.vx * dt; c.y += c.vy * dt;
    if (Math.random() < dt * 60) part(c.x + U.rand(-1, 1), c.y + U.rand(-1, 1), -c.vx * 0.15 + U.rand(-4, 4), -c.vy * 0.15 + U.rand(-4, 4), U.rand(0.5, 1.1), U.pick(['#ffd23f', '#fff3b0', '#ff9a3a', '#ffffff']), { add: true, drag: 0.8 });
    if (c.x < -30 || c.x > G.W + 30 || c.y > G.H + 30) c.dead = true;
  }
  G.comets = G.comets.filter(c => !c.dead);

  // partículas
  for (const p of G.parts) {
    p.life -= dt;
    const dr = Math.max(0, 1 - p.drag * dt);
    p.vx *= dr; p.vy *= dr; p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.spr) p.fi += p.fs * dt;
  }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const p of G.picks) {
    p.t += dt;
    const dx = G.dock.x - p.x, dy = G.dock.y - p.y, d = Math.hypot(dx, dy) || 1;
    const acc = 180 + p.t * 500;
    p.vx += (dx / d) * acc * dt; p.vy += (dy / d) * acc * dt;
    const dr = Math.max(0, 1 - dt * 2.5);
    p.vx *= dr; p.vy *= dr;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (d < 5 || p.t > 4) { p.dead = true; G.dockGlow = Math.max(G.dockGlow, 0.4); }
  }
  G.picks = G.picks.filter(p => !p.dead);
  for (const f of G.floats) f.t += dt;
  G.floats = G.floats.filter(f => f.t < f.life);
  for (const w of G.rings) w.t += dt;
  G.rings = G.rings.filter(w => w.t < 0.45);
  for (const f of G.flashes) f.t += dt;
  G.flashes = G.flashes.filter(f => f.t < f.life);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.life) G.banner = null; }
  G.shake = Math.max(0, G.shake - dt * 9);
  if (G.flash > 0) G.flash -= dt;

  // mouse: segurar para minerar (5 golpes/s)
  if (G.mouse.down) {
    G.mouse.hold += dt;
    if (G.mouse.hold >= 0.2) { G.mouse.hold -= 0.2; clickAt(G.mouse.x, G.mouse.y, true); }
  }
  G.hover = G.mouse.in ? astAt(G.mouse.x, G.mouse.y) : null;

  // economia
  refineTick(dt);
  const T = G.timers;
  T.market += dt; if (T.market >= 2) { T.market = 0; marketTick(); }
  T.auto += dt; if (T.auto >= 1) { T.auto = 0; autoSell(); }
  T.rate += dt;
  if (T.rate >= 1) {
    for (let i = 0; i < ORES.length; i++) { S.rates[i] = S.rates[i] * 0.85 + (G.gain[i] / T.rate) * 0.15; G.gain[i] = 0; }
    S.dataRate = S.dataRate * 0.85 + (G.dataGain / T.rate) * 0.15;
    G.dataGain = 0;
    let c = 0;
    for (let i = 0; i < ORES.length; i++) c += S.rates[i] * priceOf(i);
    G.cps = c;
    T.rate = 0;
  }
  T.check += dt; if (T.check >= 1) { T.check = 0; checkProgress(); }
  T.save += dt; if (T.save >= 15) { T.save = 0; save(); }
}
function updateWarp(dt) {
  const w = G.warp;
  w.t += dt;
  if (!w.switched && w.t >= 0.9) {
    w.switched = true;
    S.sector = w.to;
    for (const d of G.drones) {
      if (d.cargo.amt > 0) addOre(d.cargo.ore, d.cargo.amt, true);
      d.cargo.amt = 0; d.cargo.ore = -1; d.target = null; d.state = 'dock'; d.t = 0.5 + Math.random();
    }
    G.ast = []; G.parts = []; G.picks = []; G.bolts = []; G.spawnT = 0.3;
    for (const o of SECTORS[S.sector].ores) S.seen[o] = S.seen[o] || o === SECTORS[S.sector].ores[0];
    setupSector();
    const sec = SECTORS[S.sector];
    G.banner = { title: sec.name.toUpperCase(), sub: `SETOR ${S.sector + 1} · DUREZA ×${U.fmt(D.hpu(S.sector))}`, t: 0, life: 3.5, col: '#ffffff' };
  }
  if (w.t >= 1.8) G.warp = null;
}

/* ---------- Renderização ---------- */
function pline(c, x0, y0, x1, y1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy, n = 0;
  while (n++ < 800) {
    c.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function pcircle(c, x, y, r) {
  const n = Math.max(10, Math.floor(r * 6.5));
  for (let i = 0; i < n; i++) { const a = (i / n) * 6.2832; c.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r), 1, 1); }
}
const STAR_SPD = [1.2, 3.5, 8];
function render() {
  const c = G.ctx, W = G.W, H = G.H, t = G.t;
  c.globalCompositeOperation = 'source-over';
  c.globalAlpha = 1;
  c.drawImage(G.bg, 0, 0);

  // estrelas em paralaxe
  for (let k = 0; k < 3; k++) {

    const cx = W / 2, cy = H / 2;

    const a = G.ast.find(x => !x.entering);
    if (a) {
      const bob = Math.round(Math.sin(t * 6) * 2);
      c.fillStyle = '#ffd23f';
      const ax = Math.round(a.x), ay = Math.round(a.y - a.R - 10 + bob);
      c.fillRect(ax - 2, ay, 5, 1); c.fillRect(ax - 1, ay + 1, 3, 1); c.fillRect(ax, ay + 2, 1, 1);

/* ---------- Salvar / carregar / offline ---------- */
function save() {
  if (!S) return;
  S.last = Date.now();
  S.ph = G.hist.map(h => h.slice(-HIST_LEN).map(v => Math.round(v * 100) / 100));
  U.store.set(SAVE_KEY, JSON.stringify(S));
}

/* Migração de save: cada case converte da versão N para N+1 e cai no próximo (sem break).

  for (let i = 0; i < ORES.length; i++) {
    s.ores[i] = num0(s.ores[i]); s.ingots[i] = num0(s.ingots[i]); s.rates[i] = num0(s.rates[i]);
    s.prices[i] = typeof s.prices[i] === 'number' && isFinite(s.prices[i]) ? U.clamp(s.prices[i], 0.35, 3.2) : 1;
    s.seen[i] = !!s.seen[i];
    const h = Array.isArray(s.ph[i]) ? s.ph[i] : [];
    s.ph[i] = h.filter(v => typeof v === 'number' && isFinite(v)).slice(-HIST_LEN).map(v => U.clamp(v, 0.35, 3.2));

  for (const k in s.stats) s.stats[k] = num0(s.stats[k]);

  s.ach = idMap(raw.ach, ACH, v => (v ? 1 : 0));

  s.sector = U.clamp(s.sector | 0, 0, s.maxSector);

    return { ore, prog: busy ? U.clamp(num0(f.prog), 0, 1) : 0, busy, take: busy ? num0(f.take) : 0 };
  });

function applyOffline(sec, modal) {
  sec = Math.min(sec, D.offCap());

  const eff = D.offEff(), got = [];
  for (let i = 0; i < ORES.length; i++) {

    if (u > 0.01) { S.ores[i] += u; S.stats.mined += u; got.push([i, u]); }
  }

    if (nb > 0) { S.ores[f.ore] -= nb * B; S.ingots[f.ore] += (nb * B) / 10; S.stats.ingots += (nb * B) / 10; ing.push([f.ore, (nb * B) / 10]); }
  }

  if (modal) UI.offlineModal(sec, got, dg, ing, cr, eff);
  else UI.toast('Mineração remota', `${U.fmtTime(sec)} longe · ${got.length ? got.map(([i, u]) => `+${U.fmt(u)} ${ORES[i].name}`).join(', ') : 'sem minério'}`, 'drone', 'cyan');

/* ---------- Entrada e laço ---------- */
function toLocal(e) {
  const r = G.cv.getBoundingClientRect();

}
function initInput() {
  const cv = G.cv;
  cv.addEventListener('pointerdown', e => {
    SFX.init();
    const p = toLocal(e);
    G.mouse.x = p.x; G.mouse.y = p.y; G.mouse.in = true; G.mouse.down = true; G.mouse.hold = 0;
    clickAt(p.x, p.y, false);
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
    e.preventDefault();
  });
  cv.addEventListener('pointermove', e => { const p = toLocal(e); G.mouse.x = p.x; G.mouse.y = p.y; G.mouse.in = true; });
  const up = () => { G.mouse.down = false; };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { G.mouse.in = false; G.mouse.down = false; });

  },
  start() {
    if (G.pendingOffline > 15) applyOffline(G.pendingOffline, true);
    requestAnimationFrame(loop);
  },
  buy: buyUpgrade, sellOre, sellIngot, sellAll, research: doResearch, travel, unlock: unlockSector,
  calib: doCalib, prestige: doPrestige, pbuy: buyPrestige, save, hardReset, shardGain, canPrestige, setFurnace,
  load(obj) { S = loadState(obj); G.ast = []; G.drones = []; restoreHist(); setupSector(); syncDrones(); save(); }
};

'use strict';
/* ===== Interface: HUD, abas, inventário, toasts, modais ===== */
const UI = { tab: 'frota', busy: false, last: '', ic: {}, thumbs: {}, invLast: '', logLast: '' };
const $ = id => document.getElementById(id);
const img = (k, cls = '') => `<img class="px ${cls}" src="${UI.ic[k]}" alt="">`;

UI.init = () => {
  UI.ic = GFX.icons();
  document.querySelectorAll('[data-ico]').forEach(e => { e.innerHTML = img(e.dataset.ico); });
  $('tabs').innerHTML = TABS.map(t => `<button class="tab" id="tab-${t.id}" data-tab="${t.id}" title="${t.name}">${img(t.icon)}<span>${t.name}</span><i class="dot"></i></button>`).join('');
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (!b) return;
    UI.tab = b.dataset.tab;
    UI.render(true);
    $('tabContent').scrollTop = 0;
    SFX.play('ui');
  });
  const tc = $('tabContent');
  tc.addEventListener('pointerdown', () => { UI.busy = true; });
  window.addEventListener('pointerup', () => setTimeout(() => { UI.busy = false; }, 30));
  tc.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    UI.act(b.dataset.act, b.dataset);
  });
  tc.addEventListener('change', e => { const t = e.target; if (t.dataset.chg) UI.change(t.dataset.chg, t); });
  tc.addEventListener('input', e => { const t = e.target; if (t.dataset.inp) UI.change(t.dataset.inp, t); });
  $('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') { UI.closeModal(); return; }
    const b = e.target.closest('[data-act]');
    if (b) UI.act(b.dataset.act, b.dataset);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') UI.closeModal(); });
  UI.render(true);
  UI.update();
  setInterval(UI.update, 250);
};

UI.focusLocked = () => {
  const a = document.activeElement;
  return a && $('tabContent').contains(a) && (a.tagName === 'SELECT' || (a.tagName === 'INPUT' && a.type === 'range'));
};
UI.render = force => {
  if (!force && (UI.busy || UI.focusLocked())) return;
  const tc = $('tabContent');
  const html = UI.tabs[UI.tab]();
  if (html !== UI.last || force) {
    const st = tc.scrollTop;
    tc.innerHTML = html;
    tc.scrollTop = st;
    UI.last = html;
  }
  document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === UI.tab));
};

UI.update = () => {
  if (!S) return;
  $('credits').textContent = U.fmt(S.credits);
  $('cps').textContent = `+${U.fmt(G.cps)}/s`;
  $('data').textContent = U.fmt(S.data);
  $('shards').textContent = U.fmt(S.shards);
  $('hudShards').hidden = !(S.shards > 0 || S.stats.prestiges > 0);
  $('sectorName').textContent = `${S.sector + 1} · ${SECTORS[S.sector].name}`;

  // inventário sobre o canvas
  let inv = '';
  ORES.forEach((o, i) => { if (S.seen[i]) inv += `<span class="chip" title="${o.name}">${img('ore' + i)}<b>${U.fmt(S.ores[i])}</b></span>`; });
  let ing = '';
  ORES.forEach((o, i) => { if (S.ingots[i] >= 1) ing += `<span class="chip ing" title="${o.ingot}">${img('ingot' + i)}<b>${U.fmt(S.ingots[i])}</b></span>`; });
  const invHtml = `<div class="inv-row">${inv}</div>${ing ? `<div class="inv-row">${ing}</div>` : ''}`;
  if (invHtml !== UI.invLast) { $('inventory').innerHTML = invHtml; UI.invLast = invHtml; }

  // missão
  const g = GOALS[S.goal];
  $('goal').innerHTML = g
    ? `<small>Missão ${S.goal + 1}/${GOALS.length}</small><span>${g.t}</span><em>${img('coin')} ${U.fmt(g.r)}</em>`
    : `<small>Missões</small><span>Todas concluídas. O cosmos é seu.</span>`;

  // eventos ativos
  const ev = [];
  if (G.buffs.frenzy > 0) ev.push(`<span class="ev gold">Frenesi ×3 · ${Math.ceil(G.buffs.frenzy)}s</span>`);
  if (G.event) ev.push(`<span class="ev orange">${G.event.name} · ${Math.ceil(G.event.t)}s</span>`);
  $('eventBanner').innerHTML = ev.join('');

  // registro
  const now = performance.now();
  const logHtml = G.log.filter(l => now - l.t < 9000).map(l => `<div style="color:${l.col};opacity:${Math.max(0.15, 1 - (now - l.t) / 9000).toFixed(2)}">${l.text}</div>`).join('');
  if (logHtml !== UI.logLast) { $('log').innerHTML = logHtml; UI.logLast = logHtml; }

  // indicadores nas abas
  const dots = {
    frota: UPGRADES.some(u => { const n = buyCount(u); return n > 0 && S.credits >= upCost(u, S.upg[u.id], 1); }),
    pesquisa: S.data >= calibCost(S.dataLvl) || RESEARCH.some(r => !S.research[r.id] && S.data >= r.cost && (r.req || []).every(q => S.research[q])),
    setores: S.maxSector + 1 < SECTORS.length && S.credits >= D.sectorCost(S.maxSector + 1) && S.ingots[S.maxSector] >= SECTORS[S.maxSector + 1].req,
    salto: canPrestige() || PRESTIGE.some(p => (S.pupg[p.id] || 0) < p.max && S.shards >= p.cost(S.pupg[p.id] || 0)),
    refino: S.furnaces.slice(0, D.furnaces()).some(f => f.ore < 0)
  };
  for (const t of TABS) { const el = $('tab-' + t.id); if (el) el.classList.toggle('alert', !!dots[t.id]); }

  UI.render(false);
};

/* ---------- Abas ---------- */
const spark = i => {
  const h = G.hist[i];
  if (h.length < 2) return '';
  const w = 64, ht = 22, lo = Math.min(0.9, ...h), hi = Math.max(1.1, ...h);
  const y = v => (ht - 2 - ((v - lo) / (hi - lo)) * (ht - 4)).toFixed(1);
  const pts = h.map((v, k) => `${((k / (h.length - 1)) * w).toFixed(1)},${y(v)}`).join(' ');
  const up = h[h.length - 1] >= 1;
  return `<svg class="spark" viewBox="0 0 ${w} ${ht}" width="${w}" height="${ht}" aria-hidden="true"><line x1="0" x2="${w}" y1="${y(1)}" y2="${y(1)}" class="base"/><polyline points="${pts}" class="${up ? 'up' : 'down'}"/><circle cx="${w}" cy="${y(h[h.length - 1])}" r="2" class="${up ? 'up' : 'down'}"/></svg>`;
};

UI.tabs = {
  frota() {

      <div><small>Produção</small><b class="gold">${U.fmt(G.cps)}/s</b></div>
    </div>
    <div class="buymode"><span>Comprar</span>${[1, 10, 'max'].map(m => `<button class="btn sm ${md === m ? 'on' : ''}" data-act="mode" data-m="${m}">${m === 'max' ? 'MÁX' : '×' + m}</button>`).join('')}</div>`;
    for (const u of UPGRADES) {
      const lvl = S.upg[u.id], max = upMax(u), maxed = lvl >= max;

UI.thumb = i => {
  if (UI.thumbs[i]) return UI.thumbs[i];
  const def = SECTORS[i].planet;
  const Dm = def.type === 'star' ? 22 : 40;
  const p = new GFX.Planet(def, Dm, 500 + i * 31);
  p.render(3);
  const c = U.canvas(64, 64), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  p.drawTo(g, 32, 32);
  UI.thumbs[i] = c.toDataURL();
  return UI.thumbs[i];
};

/* ---------- Ações ---------- */
UI.act = (act, ds) => {
  switch (act) {
    case 'mode': S.buyMode = ds.m === 'max' ? 'max' : +ds.m; SFX.play('ui'); break;
    case 'buy': Game.buy(ds.id); break;
    case 'sell': { const v = Game.sellOre(+ds.i); if (v) toastMoney(v); break; }
    case 'selling': { const v = Game.sellIngot(+ds.i); if (v) toastMoney(v); break; }
    case 'sellall': Game.sellAll(); break;
    case 'res': Game.research(ds.id); break;
    case 'calib': Game.calib(); break;
    case 'travel': Game.travel(+ds.i); break;
    case 'unlock': Game.unlock(+ds.i); break;
    case 'prestige':
      UI.modal(`<h2>Confirmar Salto Quântico?</h2><p>Você receberá <b class="mag">${U.fmt(shardGain())} Fragmentos Estelares</b>. Créditos, minérios, lingotes, melhorias${S.pupg.memory ? '' : ', pesquisas'} e setores${S.pupg.shortcut ? ` (exceto ${S.pupg.shortcut})` : ''} voltam ao início.</p>
        <div class="row"><button class="btn magb" data-act="prestige-yes">Saltar</button><button class="btn" data-act="close">Cancelar</button></div>`);
      break;
    case 'prestige-yes': UI.closeModal(); Game.prestige(); break;
    case 'pbuy': Game.pbuy(ds.id); break;
    case 'sound': S.settings.sound = !S.settings.sound; break;
    case 'shake': S.settings.shake = !S.settings.shake; break;
    case 'fx': S.settings.fx = (S.settings.fx + 1) % 3; break;
    case 'scan': S.settings.scan = !S.settings.scan; break;
    case 'save': Game.save(); UI.toast('Jogo salvo', 'Progresso gravado neste navegador.', 'gear', 'cyan'); break;
    case 'export': {
      Game.save();
      const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      UI.modal(`<h2>Exportar save</h2><p>Copie o código abaixo e guarde em um lugar seguro.</p><textarea id="saveCode" readonly>${code}</textarea>
        <div class="row"><button class="btn" data-act="copy">Copiar</button><button class="btn" data-act="close">Fechar</button></div>`);
      break;
    }
    case 'copy': {
      const ta = $('saveCode');
      const done = () => UI.toast('Código copiado', 'Cole em um arquivo de texto para guardar.', 'gear', 'cyan');
      const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { /* selecionado para cópia manual */ } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback); else fallback();
      break;
    }
    case 'import':
      UI.modal(`<h2>Importar save</h2><p>Cole um código exportado. O progresso atual será substituído.</p><textarea id="importCode" placeholder="Cole o código aqui"></textarea><p id="importErr" class="r"></p>
        <div class="row"><button class="btn" data-act="import-yes">Importar</button><button class="btn" data-act="close">Cancelar</button></div>`);
      break;
    case 'import-yes':
      try {
        let obj;
        try { obj = JSON.parse(decodeURIComponent(escape(atob($('importCode').value.trim())))); } catch (e) { obj = null; }
        if (!obj || typeof obj !== 'object' || Array.isArray(obj) || !obj.upg) throw new Error('Código inválido. Confira se copiou o texto inteiro.');
        if ((obj.v | 0) > SAVE_VERSION) throw new Error('Este save é de uma versão mais nova do jogo.');
        Game.load(obj);
        UI.closeModal();
        UI.toast('Save importado', 'Bem-vindo de volta, comandante.', 'star', 'cyan');
      } catch (e) { $('importErr').textContent = e.message; }
      break;
    case 'reset':
      UI.modal(`<h2>Apagar todo o progresso?</h2><p>Isso inclui fragmentos, conquistas e estatísticas. Não há como desfazer.</p>
        <div class="row"><button class="btn danger" data-act="reset-yes">Apagar tudo</button><button class="btn" data-act="close">Cancelar</button></div>`);
      break;
    case 'reset-yes': Game.hardReset(); UI.closeModal(); break;
    case 'close': UI.closeModal(); break;
  }
  document.body.classList.toggle('noscan', !S.settings.scan);
  UI.render(true);
};
UI.change = (kind, t) => {
  if (kind === 'furn') { Game.setFurnace(+t.dataset.k, +t.value); t.blur(); SFX.play('ui'); }
  else if (kind === 'auto') S.autosell.on = t.checked;
  else if (kind === 'autoing') S.autosell.ingots = t.checked;
  else if (kind === 'thr') { S.autosell.thr = +t.value; const b = t.parentElement.querySelector('b'); if (b) b.textContent = Math.round(S.autosell.thr * 100) + '%'; return; }
  UI.render(true);
};

/* ---------- Toasts e modais ---------- */
UI.toast = (title, text, icon, cls) => {
  const el = document.createElement('div');
  el.className = 'toast ' + (cls || '');
  el.innerHTML = `${img(icon || 'star')}<div><b>${title}</b><small>${text}</small></div>`;
  $('toasts').appendChild(el);
  setTimeout(() => el.classList.add('out'), 4200);
  setTimeout(() => el.remove(), 4800);
  while ($('toasts').children.length > 4) $('toasts').firstChild.remove();
};
UI.modal = html => { $('modalBody').innerHTML = html; $('modal').hidden = false; };
UI.closeModal = () => { $('modal').hidden = true; $('modalBody').innerHTML = ''; };
UI.offlineModal = (sec, got, dg, ing, cr, eff) => {
  const rows = got.map(([i, u]) => `<div class="chip big">${img('ore' + i)}<span>${ORES[i].name}</span><b>+${U.fmt(u)}</b></div>`).join('')
    + ing.map(([i, u]) => `<div class="chip big">${img('ingot' + i)}<span>${ORES[i].ingot}</span><b>+${U.fmt(u)}</b></div>`).join('');
  UI.modal(`<h2>Relatório da frota</h2><p>Sua frota trabalhou por <b>${U.fmtTime(sec)}</b> enquanto você esteve fora (eficiência ${Math.round(eff * 100)}%).</p>
    <div class="grid2">${rows}${dg >= 1 ? `<div class="chip big">${img('data')}<span>Dados</span><b>+${U.fmt(dg)}</b></div>` : ''}${cr > 0 ? `<div class="chip big">${img('coin')}<span>Vendas automáticas</span><b>+${U.fmt(cr)}</b></div>` : ''}</div>
    <div class="row"><button class="btn wide" data-act="close">Continuar minerando</button></div>`);
};

window.addEventListener('load', () => {
  Game.init();
  UI.init();
  document.body.classList.toggle('noscan', !S.settings.scan);
  Game.start();
});

</script>
</body>
</html>
